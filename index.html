<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva - Vôlei na BYD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .volleyball {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 15s infinite linear;
        }

        .volleyball::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 2px solid #333;
            border-radius: 50%;
            border-left: 2px solid transparent;
            border-right: 2px solid transparent;
        }

        .volleyball::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
            width: 40px;
            height: 40px;
            border: 2px solid #333;
            border-radius: 50%;
            border-left: 2px solid transparent;
            border-right: 2px solid transparent;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
            }
        }

        .container {
            text-align: center;
            z-index: 1;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        .title {
            color: white;
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .time-unit {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            min-width: 100px;
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .time-unit:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .time-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            display: block;
        }

        .time-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .event-info {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .event-time {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .event-location {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }

        .finished-message {
            display: none;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            animation: celebration 1s infinite alternate;
        }

        @keyframes celebration {
            0% { transform: scale(1) rotate(-1deg); }
            100% { transform: scale(1.1) rotate(1deg); }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            .countdown {
                gap: 10px;
            }
            
            .time-unit {
                min-width: 80px;
                padding: 15px 10px;
            }
            
            .time-number {
                font-size: 2rem;
            }
            
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <h1 class="title">🏐 VÔLEI na Arena BYD</h1>
        <p class="subtitle">Contagem regressiva para o jogo</p>
        
        <div class="countdown" id="countdown">
            <div class="time-unit">
                <span class="time-number" id="days">00</span>
                <span class="time-label">Dias</span>
            </div>
            <div class="time-unit">
                <span class="time-number" id="hours">00</span>
                <span class="time-label">Horas</span>
            </div>
            <div class="time-unit">
                <span class="time-number" id="minutes">00</span>
                <span class="time-label">Minutos</span>
            </div>
            <div class="time-unit">
                <span class="time-number" id="seconds">00</span>
                <span class="time-label">Segundos</span>
            </div>
        </div>
        
        <div class="finished-message" id="finishedMessage">
            🎉 É HORA DO JOGO! 🏐
        </div>
        
        <div class="event-info">
            <div class="event-time">Hoje às 19:00</div>
            <div class="venue-info" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.2);">
                <div style="color: white; font-size: 1.3rem; font-weight: bold; margin-bottom: 15px;">📍 Arena BYD</div>
                <div style="background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; margin-bottom: 10px;">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3943.3937888746327!2d-63.897949399999995!3d-8.748968399999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x92325ddfac3fab09%3A0xd09d3ee3982d6588!2sArena%20BYD!5e0!3m2!1spt-BR!2sbr!4v1758986604516!5m2!1spt-BR!2sbr"
                        width="100%" 
                        height="200" 
                        style="border:0; border-radius: 8px;" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
                <a href="https://maps.app.goo.gl/9JgzGBdaGnTDtnwz7" target="_blank" style="color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.9rem; transition: color 0.3s ease;" onmouseover="this.style.color='white'" onmouseout="this.style.color='rgba(255,255,255,0.8)'">
                    🗺️ Abrir no Google Maps
                </a>
            </div>
        </div>
    </div>

    <script>
        // Função principal da contagem regressiva
        function updateCountdown() {
            // Horário atual no Brasil (considerando fuso horário)
            const now = new Date();
            
            // Data e hora do jogo: hoje às 19:00 no horário de Manaus (AMT - UTC-4)
            const gameDate = new Date();
            
            // Configurar para hoje às 19:00 (horário local do usuário)
            gameDate.setHours(19, 0, 0, 0);
            
            // Ajustar para o fuso horário de Manaus (AMT = UTC-4)
            // Se o usuário estiver em um fuso diferente, ajustamos
            const userTimezoneOffset = now.getTimezoneOffset(); // em minutos
            const manausTimezoneOffset = 4 * 60; // AMT é UTC-4, então +4 horas em minutos
            const timezoneAdjustment = (userTimezoneOffset - manausTimezoneOffset) * 60 * 1000; // em ms
            
            const targetTime = new Date(gameDate.getTime() + timezoneAdjustment);
            
            // Se o jogo já passou, mostrar mensagem
            if (now >= targetTime) {
                document.getElementById('countdown').style.display = 'none';
                document.getElementById('finishedMessage').style.display = 'block';
                return;
            }
            
            // Calcular diferença de tempo
            const timeDifference = targetTime - now;
            
            // Calcular unidades de tempo
            const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);
            
            // Atualizar display
            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            
            // Efeito visual quando restam menos de 1 minuto
            if (timeDifference < 60000) { // menos de 1 minuto
                document.querySelectorAll('.time-unit').forEach(unit => {
                    unit.style.animation = 'pulse 0.5s infinite';
                });
            }
        }

        // Inicializa a página
        document.addEventListener('DOMContentLoaded', function() {
            updateCountdown();
            
            // Atualiza a contagem a cada segundo
            setInterval(updateCountdown, 1000);
        });
    </script>
</body>
</html>
